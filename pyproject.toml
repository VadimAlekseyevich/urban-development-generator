[project]
name = "urban-development-generator"
version = "0.1.0"
description = "Procedural urban development generation and evaluation service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13",
  "arq>=0.26",
  "fastapi>=0.115",
  "geoalchemy2>=0.15",
  "geopandas>=1.0",
  "httpx>=0.27",
  "networkx>=3.3",
  "numpy>=2.0",
  "orjson>=3.10",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "pyogrio>=0.10",
  "pyproj>=3.7",
  "python-multipart>=0.0.12",
  "rasterio>=1.4",
  "redis>=5.0",
  "scipy>=1.14",
  "shapely>=2.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
