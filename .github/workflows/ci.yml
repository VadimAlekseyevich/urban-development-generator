name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: urban_generator
          POSTGRES_USER: urban
          POSTGRES_PASSWORD: urban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urban -d urban_generator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://urban:urban@localhost:5432/urban_generator
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run mypy backend core worker
      - run: uv run pytest
      - name: Road reference benchmark
        run: uv run python -m benchmarks.road_network_reference
      - name: Block parcel reference benchmark
        run: uv run python -m benchmarks.block_parcel_reference
      - name: Building reference benchmark
        run: uv run python -m benchmarks.building_reference --building-counts 1000 10000
      - name: Migration smoke
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build and start complete stack
        run: docker compose up -d --build
      - name: Wait for API readiness
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null; do sleep 3; done'
      - name: Wait for frontend
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:5173/ >/dev/null; do sleep 3; done'
      - name: Inspect stack
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
