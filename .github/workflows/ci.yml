name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: urban_generator
          POSTGRES_USER: urban
          POSTGRES_PASSWORD: urban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urban -d urban_generator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://urban:urban@localhost:5432/urban_generator
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run mypy backend core worker
      - run: uv run pytest
      - name: S14 PostgreSQL EXPLAIN ANALYZE profile
        run: |
          uv run python -m benchmarks.db_query_plans \
            --rows 10000 --output /tmp/udg-db-query-plans.json
      - name: Save query plans for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-query-plans
          path: /tmp/udg-db-query-plans.json
          if-no-files-found: ignore
          retention-days: 14
      - name: S14 raster peak RSS and GDAL window profile
        run: |
          uv run python -m benchmarks.raster_memory_reference \
            --width 2048 --height 2048 --tile-size 256 \
            --gdal-cache-mb 64 --output /tmp/udg-raster-memory.json
      - name: Save raster memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-memory-profile
          path: /tmp/udg-raster-memory.json
          if-no-files-found: ignore
          retention-days: 14
      - name: S3 ArtifactStore MinIO contract smoke
        run: |
          git clone --depth 1 \
            --branch RELEASE.2025-05-24T17-08-30Z \
            https://github.com/minio/minio.git /tmp/udg-minio-src
          (cd /tmp/udg-minio-src && go build -o /tmp/udg-minio-server .)
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            /tmp/udg-minio-server server /tmp/udg-minio-data \
            >/tmp/udg-minio.log 2>&1 &
          minio_pid=$!
          trap 'kill "$minio_pid" >/dev/null 2>&1 || true' EXIT
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 2; done'
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/aistor/mc:latest -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/udg-artifacts'
          MINIO_TEST_ENDPOINT_URL=http://127.0.0.1:9000 \
          MINIO_TEST_BUCKET=udg-artifacts \
          MINIO_TEST_ACCESS_KEY=minioadmin \
          MINIO_TEST_SECRET_KEY=minioadmin \
            uv run pytest tests/integration/test_s3_artifact_store_minio.py
      - name: Road reference benchmark
        run: uv run python -m benchmarks.road_network_reference
      - name: Block parcel reference benchmark
        run: uv run python -m benchmarks.block_parcel_reference
      - name: Building reference benchmark
        run: uv run python -m benchmarks.building_reference --building-counts 1000 10000
      - name: Infrastructure reference benchmark
        run: uv run python -m benchmarks.infrastructure_reference
      - name: Migration smoke
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade 0012_generated_zone_persistence
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text

          from backend.app.core.config import settings

          engine = create_engine(settings.database_url)
          project_id = "00000000-0000-0000-0000-000000000101"
          dataset_id = "00000000-0000-0000-0000-000000000102"
          version_id = "00000000-0000-0000-0000-000000000103"
          road_id = "00000000-0000-0000-0000-000000000104"

          with engine.begin() as connection:
              connection.execute(
                  text(
                      """
                      INSERT INTO projects (id, name, working_srid, boundary_metadata)
                      VALUES (:project_id, 'migration-smoke', 32637, '{}'::jsonb)
                      """
                  ),
                  {"project_id": project_id},
              )
              connection.execute(
                  text(
                      """
                      INSERT INTO datasets (id, project_id, kind)
                      VALUES (:dataset_id, :project_id, 'roads')
                      """
                  ),
                  {"dataset_id": dataset_id, "project_id": project_id},
              )
              connection.execute(
                  text(
                      """
                      INSERT INTO dataset_versions (
                          id, dataset_id, version, status, source_metadata
                      )
                      VALUES (
                          :version_id, :dataset_id, 1, 'processing', '{}'::jsonb
                      )
                      """
                  ),
                  {"version_id": version_id, "dataset_id": dataset_id},
              )
              connection.execute(
                  text(
                      """
                      INSERT INTO source_roads (
                          id,
                          dataset_version_id,
                          source_feature_id,
                          attributes_json,
                          road_class,
                          geometry
                      )
                      VALUES (
                          :road_id,
                          :version_id,
                          'migration-road',
                          '{"osm_tags":{"oneway":"-1","bridge":"yes","tunnel":"no","layer":"2"}}'::jsonb,
                          'residential',
                          ST_GeomFromText(
                              'MULTILINESTRING((0 0, 10 0))',
                              32637
                          )
                      )
                      """
                  ),
                  {"road_id": road_id, "version_id": version_id},
              )
              connection.execute(
                  text(
                      """
                      UPDATE dataset_versions
                      SET status = 'ready'
                      WHERE id = :version_id
                      """
                  ),
                  {"version_id": version_id},
              )
          PY
          uv run alembic upgrade head
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import DBAPIError

          from backend.app.core.config import settings

          engine = create_engine(settings.database_url)
          road_id = "00000000-0000-0000-0000-000000000104"

          with engine.connect() as connection:
              row = connection.execute(
                  text(
                      """
                      SELECT one_way_direction, one_way, bridge, tunnel, layer
                      FROM source_roads
                      WHERE id = :road_id
                      """
                  ),
                  {"road_id": road_id},
              ).one()

          assert row == ("reverse", True, True, False, 2)

          try:
              with engine.begin() as connection:
                  connection.execute(
                      text(
                          """
                          UPDATE source_roads
                          SET layer = 3
                          WHERE id = :road_id
                          """
                      ),
                      {"road_id": road_id},
                  )
          except DBAPIError as exc:
              assert "source entities of a ready dataset version are immutable" in str(exc)
          else:
              raise AssertionError("ready source-row guard was not restored")

          with engine.begin() as connection:
              connection.execute(text("TRUNCATE TABLE projects CASCADE"))
          PY
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build


  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated Compose stack
        run: cp .env.example .env
      - name: Start API and frontend
        run: docker compose up -d --build
      - name: Wait for API and frontend readiness
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null; do sleep 3; done'
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:5173/ >/dev/null; do sleep 3; done'
      - name: Install pinned Playwright test runner
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser create/upload/run/inspect/compare/export
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Retain browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-debug
          path: |
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Diagnose services on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 api dispatcher worker-ingest worker-generation worker-analysis worker-export worker-legacy || true
      - name: Stop isolated stack
        if: always()
        run: docker compose down -v

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build and start complete stack
        run: docker compose up -d --build
      - name: Wait for API readiness
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null; do sleep 3; done'
      - name: Wait for frontend
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:5173/ >/dev/null; do sleep 3; done'
      - name: Verify all queue workers survive startup
        run: |
          sleep 12
          docker compose ps
          docker compose logs --tail=35 worker-ingest worker-generation worker-analysis worker-export worker-legacy dispatcher
          for service in worker-ingest worker-generation worker-analysis worker-export worker-legacy dispatcher; do
            cid=$(docker compose ps -q "$service")
            test -n "$cid"
            state=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            test "$state" = running
            test "$restarts" -eq 0
          done
      - name: Inspect stack
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
