name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: urban_generator
          POSTGRES_USER: urban
          POSTGRES_PASSWORD: urban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urban -d urban_generator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://urban:urban@localhost:5432/urban_generator
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --dev
      - name: Upload generated Python lockfile
        uses: actions/upload-artifact@v4
        with:
          name: python-lock
          path: uv.lock
          retention-days: 1
      - run: uv run ruff check .
      - run: uv run mypy backend core worker
      - run: uv run pytest
      - name: Migration smoke
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Upload generated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lock
          path: frontend/package-lock.json
          retention-days: 1
      - run: npm run typecheck
      - run: npm run build

  persist-lockfiles:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-lock
          path: .generated/python
      - uses: actions/download-artifact@v4
        with:
          name: frontend-lock
          path: .generated/frontend
      - name: Persist lockfiles
        run: |
          cp .generated/python/uv.lock uv.lock
          cp .generated/frontend/package-lock.json frontend/package-lock.json
          if [ -z "$(git status --porcelain -- uv.lock frontend/package-lock.json)" ]; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock frontend/package-lock.json
          git commit -m "chore: add reproducible dependency lockfiles"
          git push
