name: One-time S09-T06 Ruff fix

on:
  push:
    branches:
      - work/s09-t06-block-zone-aggregation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Apply Ruff import fix
        run: uv run ruff check tests/unit/test_demographic_aggregation.py --fix
      - name: Commit fix if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Ruff changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_demographic_aggregation.py
          git commit -m "style: auto-fix S09-T06 imports"
          git push origin HEAD:work/s09-t06-block-zone-aggregation
