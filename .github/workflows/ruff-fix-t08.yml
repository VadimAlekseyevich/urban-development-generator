name: T08 Ruff Autofix

on:
  push:
    branches:
      - work/s09-t08-spatial-calibration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/s09-t08-spatial-calibration
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - name: Apply Ruff import fix
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/unit/test_spatial_demographic_calibration.py --fix
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_spatial_demographic_calibration.py
          git commit -m "style: apply Ruff import ordering for S09-T08"
          git push origin HEAD:work/s09-t08-spatial-calibration
